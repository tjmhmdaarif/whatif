[project]
name = "graphrag-multihop"
version = "0.1.0"
description = "GraphRAG system combining knowledge graph traversal with vector retrieval for multi-hop QA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.37.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "orjson>=3.10.0",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.5.0",
    "pyvis>=0.3.2",
    "datasets>=2.20.0",
    "tqdm>=4.66.0",
    "rapidfuzz>=3.0.0",
    "torchvision>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "anthropic>=0.30.0",
]
neo4j = [
    "neo4j>=5.20.0",
]
chroma = [
    "chromadb>=0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "anthropic>=0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "C4", "PT", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "TD", "FA", "PD", "PIC", "INP", "TRIVIA"]
ignore = ["S101", "S311", "B008", "C901", "T201", "T203"]
per-file-ignores = { "tests/**/*" = ["S101", "S311", "B008"], "src/graphrag/cli.py" = ["T201", "T203"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"